<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Agentic DR">
  <title>Agentic DR</title>
  <!--
    The mark is the thesis, not decoration.

    A recovery ring, because the claim this project makes is that a DR estate is regenerated rather
    than maintained. It is broken into three segments and closed by an arrowhead: the estate comes
    back in tiers, in apply order, not all at once — and the gaps are where a human gate sits.

    Colours are nordbye.it's own accents (#378144 / #51a45e / #8ec798). Each tint is opaque rather
    than an alpha ramp, so the mark holds on a light and a dark page from one asset: transparency
    over #0d1117 turns to mud. Deepest green leads, palest trails, so the ring reads as filling.

    Geometry is generated, not hand-nudged — 104° segments on a 44px radius with 16° gaps, the
    arrowhead flush to the last segment's tangent. Re-derive it rather than tweaking coordinates.
  -->
  <g fill="none" stroke-width="15">
    <path d="M70.1 20.4 A 44 44 0 0 1 104.8 80.5" stroke="#8ec798"/>
    <path d="M98.7 91.1 A 44 44 0 0 1 29.3 91.1" stroke="#51a45e"/>
    <path d="M23.2 80.5 A 44 44 0 0 1 47.5 23.2" stroke="#378144"/>
  </g>
  <path d="M67.0 15.3 L43.2 12.5 L51.8 33.9 Z" fill="#378144"/>
</svg>
