<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Agentic DR">
  <title>Agentic DR</title>
  <!--
    The mark is the thesis, not decoration.

    Left, one solid block: production, read as truth and never written to. The arc is the failover,
    and it only ever runs one way. Right, the DR region — deliberately not a mirrored block, because
    the claim this project makes is that DR is regenerated rather than maintained. It is drawn as
    three tiers that materialise in apply order, which is exactly what the resolver computes.

    Colours are nordbye.it's own greens (#378144 / #51a45e / #6bb679 / #8ec798), so the project and
    the site read as one thing. Every tint is opaque rather than an alpha ramp, so a single asset
    holds on a light and a dark page alike: transparency over #0d1117 turns to mud.

    Tier gaps are 5px at a 128px viewBox — wide enough to survive being scaled to a 16px favicon,
    where a 3px gap closes up and the three tiers read as one block.
  -->

  <!-- failover: one direction only -->
  <path d="M30 70 C30 22 98 22 98 62" fill="none" stroke="#51a45e" stroke-width="14"/>
  <path d="M98 78 L84 50 L112 50 Z" fill="#51a45e"/>

  <!-- production -->
  <rect x="7" y="78" width="46" height="44" rx="10" fill="#378144"/>

  <!-- DR, regenerated in tiers -->
  <rect x="75" y="78"    width="46" height="11.5" rx="5" fill="#8ec798"/>
  <rect x="75" y="94.5"  width="46" height="11.5" rx="5" fill="#6bb679"/>
  <rect x="75" y="111"   width="46" height="11"   rx="5" fill="#51a45e"/>
</svg>
