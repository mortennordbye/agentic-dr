# Platform ingress. Regenerated into the DR overlay on every build.
controller:
  replicaCount: 2
  service:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      service.beta.kubernetes.io/azure-load-balancer-ipv4: 10.200.8.40
  nodeSelector:
    topology.kubernetes.io/region: northeurope
  config:
    # On-prem ranges trusted by the internal gateway. A human confirms this for DR.
    proxy-real-ip-cidr: 10.150.0.0/16
metrics:
  workspace: ctso-dr-prod-neu-law
