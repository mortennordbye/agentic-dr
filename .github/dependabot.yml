# This repo has no package manifests and no runtime dependencies — the engine uses only Node
# builtins and bash. What it does depend on is the set of actions pinned in .github/workflows/,
# and a pin that goes stale fails at action resolution before doing any work. That is the whole
# job of this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    groups:
      # One PR a week for the routine bumps. Majors stay individual, because a major action
      # bump is a behaviour change worth reading on its own.
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
