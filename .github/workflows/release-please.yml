name: Release Please

# Requires the repository setting "Allow GitHub Actions to create and approve pull requests"
# (API: actions/permissions/workflow, can_approve_pull_request_reviews). That flag governs create
# AND approve together, so hardening it off — a reasonable default elsewhere — makes this workflow
# fail at the final step with "GitHub Actions is not permitted to create or approve pull requests",
# after it has already built the branch and commit. Harmless here because nothing requires review
# approvals; if this repo ever requires them, move release-please to a PAT instead of re-hardening
# the flag and silently losing releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
