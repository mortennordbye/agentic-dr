name: Dependency Review

# The dependency graph for this repo is its GitHub Actions, so this is the gate that catches a
# pull request swapping in a vulnerable or yanked action version.
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
