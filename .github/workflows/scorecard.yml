name: Scorecard

# OpenSSF supply-chain grade, published to the Security tab and the README badge.
# Expect points off for pinning actions to version tags rather than commit SHAs: that trade is
# deliberate here, because a readable pin that Dependabot can bump beats a SHA nobody updates.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions: read-all

concurrency:
  # Not cancel-in-progress: a cancelled run can drop the OIDC publish half-way.
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
